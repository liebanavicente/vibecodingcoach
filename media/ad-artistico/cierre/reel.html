<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cierre del anuncio artístico</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=block" rel="stylesheet">
<link href="../../kit/kit.css" rel="stylesheet">
<script src="../../kit/icons.js"></script>
<style>
  .claim { margin: 0; font-size: 92px; font-weight: 800; letter-spacing: -0.045em; line-height: 1.04; }
  .free { display: inline-flex; align-items: center; gap: 18px; border-radius: 999px; background: var(--grad); box-shadow: 0 30px 60px rgba(242, 69, 47, 0.35), 0 2px 0 rgba(255, 255, 255, 0.4) inset; color: white; font-size: 56px; font-weight: 800; padding: 34px 56px; }
  .free svg { font-size: 60px; }
</style>
</head>
<body>
<!-- 4 s brand closing appended after clip.mp4 by montar.sh. -->
<div id="stage" data-total="4">
  <section class="scene slide warm" data-start="0" data-end="4">
    <div class="center">
      <p class="claim" data-fx="up" data-in="0.1">Tu idea, <span class="grad">tu web.</span><br>Con IA.</p>
      <div data-fx="bounce" data-in="0.6" data-dur="0.8" style="margin-top:70px"><svg class="ml" data-ml width="220"></svg></div>
      <p class="cta-word wm" data-fx="up" data-in="1.0" style="margin-top:34px">vibe<span>coding</span>coach</p>
      <div data-fx="pop" data-in="1.4" data-dur="0.6" style="margin-top:50px"><div class="free" data-pulse="2"><span data-icon="calendar"></span>Primera clase gratis</div></div>
      <div class="cta-url glass" data-fx="up" data-in="1.8">vibecoding.miguelliebana.com</div>
    </div>
  </section>
</div>
<script src="../../kit/engine.js"></script>
</body>
</html>
