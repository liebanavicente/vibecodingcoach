<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Píldora con la web (transparente)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=block" rel="stylesheet">
<link href="../../kit/kit.css" rel="stylesheet">
<style>
  /* Transparent 720x1280 overlay with the site address near the top, pasted over the avatar's last seconds. */
  html, body { background: transparent; }
  .card { position: relative; width: 720px; height: 1280px; font-family: Inter, system-ui, sans-serif; color: var(--ink); }
  .pill { position: absolute; top: 160px; left: 0; right: 0; display: flex; justify-content: center; }
  .pill div { border-radius: 999px; font-size: 30px; font-weight: 800; padding: 15px 28px; }
</style>
</head>
<body>
<section class="card"><div class="pill"><div class="glass">vibecoding.miguelliebana.com</div></div></section>
</body>
</html>
