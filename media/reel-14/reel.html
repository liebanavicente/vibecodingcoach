<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reel 14 · De idea a web en 3 pasos (plantilla cine)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=block" rel="stylesheet">
<link href="../kit/kit.css" rel="stylesheet">
<link href="../kit/cine.css" rel="stylesheet">
<style>
  /* Lifts the clip (and the bar that follows it) so its prompt bar sits above the captions. */
  .flow-frame { position: absolute; inset: 0; transform: scale(1.2); transform-origin: 50% 100%; }
  .flow-bar { position: absolute; z-index: 2; display: flex; align-items: center; gap: 18px; overflow: hidden; border: 2px solid rgba(255, 255, 255, 0.9); border-radius: 999px; background: rgba(255, 255, 255, 0.82); box-shadow: 0 20px 50px rgba(60, 80, 140, 0.18); color: #141722; font-size: 38px; font-weight: 600; padding: 0 30px; white-space: nowrap; -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
  .flow-bar [data-icon] { display: grid; color: #6b7080; font-size: 40px; }
  .caret { display: inline-block; width: 3px; height: 0.95em; margin-left: 3px; background: var(--orange); vertical-align: -0.12em; }
</style>
<script src="../kit/icons.js"></script>
</head>
<body>
<!-- Plantilla «cine»: clips de Flow a pantalla completa + guion encima. Copia esta carpeta, cambia los clips
     (data-video, relativo a esta carpeta), los textos y los tiempos; data-segments = inicio de cada escena. -->
<div id="stage" data-total="25">

  <section class="scene cine" data-start="0" data-end="5.2" data-video="../reel-01/clips/a.mp4" data-rate="0.75" data-zoom="1.12">
    <video muted playsinline preload="auto"></video>
    <div class="cine-copy">
      <p class="slam slam-xl" data-fx="slam" data-in="0.15" data-dur="0.5">No sé <span class="grad">programar.</span></p>
      <p class="karaoke" data-words="Y aun así publiqué mi primera web en una tarde." data-in="1.4" data-dur="2.8"></p>
    </div>
  </section>

  <section class="scene cine" data-start="5.2" data-end="10.6" data-video="../reel-01/clips/b.mp4" data-rate="0.6">
    <div class="flow-frame">
    <video muted playsinline preload="auto"></video>
    <!-- Covers the made-up "Enterer ort your propet" bar Flow drew, and follows it as it shrinks away. -->
    <div class="flow-bar" data-box="[[0,212,902,636,126,1],[3.0,210,902,640,126,1],[3.5,226,926,604,118,1],[3.75,290,985,470,92,1],[4.0,345,1038,350,66,1],[4.5,345,1038,350,66,1],[4.8,345,1038,350,66,0]]">
      <span data-icon="search"></span><span><span data-type="Una web para mi panadería" data-in="0.4" data-dur="1.5"></span><i class="caret" data-blink></i></span>
    </div>
    </div>
    <div class="cine-copy">
      <p class="chapter" data-fx="left" data-in="0.1"><b>1</b> Paso uno</p>
      <p class="slam" data-fx="slam" data-in="0.45" data-dur="0.5">Cuéntale tu idea</p>
      <div class="underline" data-fx="wipe" data-in="0.9" data-dur="0.5"></div>
      <p class="karaoke" data-words="Con palabras normales, como se la contarías a un amigo." data-in="1.3" data-dur="3"></p>
    </div>
  </section>

  <section class="scene cine" data-start="10.6" data-end="15.8" data-video="../reel-01/clips/c.mp4" data-rate="0.75" data-zoom="1.1">
    <video muted playsinline preload="auto"></video>
    <div class="cine-copy">
      <p class="chapter" data-fx="left" data-in="0.1"><b>2</b> Paso dos</p>
      <p class="slam" data-fx="slam" data-in="0.45" data-dur="0.5">Pide un plan, <span class="grad">no código</span></p>
      <div class="underline" data-fx="wipe" data-in="0.9" data-dur="0.5"></div>
      <p class="karaoke" data-words="La IA propone, tú decides. Un cambio cada vez." data-in="1.3" data-dur="2.8"></p>
    </div>
  </section>

  <section class="scene cine" data-start="15.8" data-end="21.2" data-video="../curso-video/clip.mp4" data-zoom="1.06">
    <div class="cine-glow"></div>
    <div class="cine-window" data-fx="pop" data-in="0.1" data-dur="0.7">
      <video muted playsinline preload="auto"></video>
    </div>
    <div class="cine-copy">
      <p class="chapter" data-fx="left" data-in="0.3"><b>3</b> Paso tres</p>
      <p class="slam" data-fx="slam" data-in="0.65" data-dur="0.5">Publícala</p>
      <div class="underline" data-fx="wipe" data-in="1.1" data-dur="0.5"></div>
      <p class="karaoke" data-words="Gratis, con tu propio enlace, para enseñarla a quien quieras." data-in="1.5" data-dur="3"></p>
    </div>
  </section>

  <section class="scene cine" data-start="21.2" data-end="25">
    <div class="cine-glow"></div>
    <div class="cine-cta">
      <p class="slam" data-fx="slam" data-in="0.1" data-dur="0.5" style="transform-origin:50% 50%">Te enseño <span class="grad">desde cero.</span></p>
      <div data-fx="bounce" data-in="0.8" data-dur="0.85" style="margin-top:80px"><svg class="ml" data-ml width="230"></svg></div>
      <p class="cta-word wm" data-fx="up" data-in="1.2">vibe<span>coding</span>coach</p>
      <p class="cta-sec" data-fx="up" data-in="1.6" style="color:rgba(255,255,255,0.7)">Curso gratis en</p>
      <div class="cta-url" data-fx="up" data-in="1.8" style="margin-top:22px">vibecoding.miguelliebana.com</div>
    </div>
  </section>

  <div class="hud">
    <div class="segments" data-segments="0,5.2,10.6,15.8,21.2"><span class="seg"><i></i></span><span class="seg"><i></i></span><span class="seg"><i></i></span><span class="seg"><i></i></span><span class="seg"><i></i></span></div>
    <div class="hud-badge"><svg class="ml" data-ml width="64"></svg><span>vibe<span>coding</span>coach</span></div>
  </div>

</div>
<script src="../kit/engine.js"></script>
</body>
</html>
